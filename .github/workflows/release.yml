name: Release Kaze

# Triggers on every version tag like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v*'
  # Also allow manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.0.4)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Linux Build Job ─────────────────────────────────────────────────────────
  build-linux:
    name: Build (linux-x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Node.js / npm ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # ── Linux system dependencies ───────────────────────────────────────
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # ── Build and sign (build-only, no release publish) ─────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: '--target x86_64-unknown-linux-gnu'

      # ── Upload build outputs as workflow artifact ───────────────────────
      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/deb/Kaze_*
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/Kaze_*
            target/x86_64-unknown-linux-gnu/release/bundle/rpm/Kaze*
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/Kaze_*
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/Kaze_*
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/Kaze*
          if-no-files-found: error

  # ── Windows Build Job ───────────────────────────────────────────────────────
  build-windows:
    name: Build (windows-x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Node.js / npm ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # ── Build and sign (build-only, no release publish) ─────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: '--target x86_64-pc-windows-msvc'

      # ── Upload build outputs as workflow artifact ───────────────────────
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/Kaze_*
            target/x86_64-pc-windows-msvc/release/bundle/nsis/Kaze_*
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/Kaze_*
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Kaze_*
          if-no-files-found: error

  # ── Arch Linux Build Job ───────────────────────────────────────────────────
  build-arch:
    name: Build (arch-x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust cargo nodejs npm webkit2gtk-4.1 gtk3 alsa-lib libsoup3 openssl sudo pacman-contrib

      - name: Build Arch package
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "cd packaging/arch && (updpkgsums || true) && makepkg -s --noconfirm"

      - name: Upload Arch build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-arch
          path: packaging/arch/*.pkg.tar.zst*
          if-no-files-found: error

  # ── Dedicated Publish Job ───────────────────────────────────────────────────
  publish-release:
    name: Publish Release
    needs:
      - build-linux
      - build-windows
      - build-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag_info
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Downloaded release artifacts:"
          ls -la release-artifacts

      - name: Prepare release notes
        run: |
          cat << EOF > release_notes.md
          ## Kaze ${RELEASE_TAG}

          > ⚠️ **Important Compatibility Notice:**
          > This release includes a statistics/history storage migration and updated cloud sync format. Older builds are no longer compatible with the current sync backend and should be upgraded.

          Download the installer for your platform below:

          | Platform | File | Notes |
          |---|---|---|
          | 🐧 Linux (Arch/CachyOS/Manjaro) | \`.pkg.tar.zst\` | Native Arch package, best performance |
          | 🐧 Linux (Debian/Ubuntu) | \`.deb\` | Recommended for Ubuntu, Mint, Pop!_OS |
          | 🐧 Linux (AppImage) | \`.AppImage\` | Works on any Linux distro |
          | 🐧 Linux (RPM) | \`.rpm\` | For Fedora, openSUSE, RHEL |
          | 🪟 Windows | \`_x64-setup.exe\` | NSIS installer, double-click to install |
          | 🪟 Windows (MSI) | \`_x64_en-US.msi\` | Alternative Windows installer |

          > **Already installed?** Just keep the app open — it checks for updates automatically and will restart with the new version.

          > **First time?** See [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/prod/INSTALL.md) for step-by-step instructions.

          > *(Note: \`.sig\` files and \`latest.json\` are cryptographic verification files used internally by the auto-updater; you do not need to download them manually.)*
          EOF

      - name: Generate updater manifest (latest.json)
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const artifactsDir = path.resolve("release-artifacts");
          const uploadDir = path.resolve("release-upload");
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GITHUB_REPOSITORY;
          const releaseNotes = fs.readFileSync("release_notes.md", "utf8").trim();
          const version = tag.replace(/^v/, "");

          const tauriConfPath = path.resolve("src-tauri/tauri.conf.json");
          const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
          const createUpdaterArtifacts = tauriConf?.bundle?.createUpdaterArtifacts;
          console.log("Read tauri.conf.json - createUpdaterArtifacts:", createUpdaterArtifacts);

          // Recursively discover all regular files under release-artifacts
          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          function isReleaseAsset(filePath) {
            const base = path.basename(filePath);

            // Explicitly ignore known internal packaging files and directories
            if (base === "control.tar.gz" || base === "data.tar.gz" || base === "debian-binary") return false;
            if (base === "control" || base === "Kaze.desktop" || base.endsWith(".png")) return false;

            // Linux release assets
            if (base.endsWith(".pkg.tar.zst") || base.endsWith(".pkg.tar.zst.sig")) return true;
            if (base.endsWith(".AppImage") || base.endsWith(".AppImage.sig")) return true;
            if (base.endsWith(".deb") || base.endsWith(".deb.sig")) return true;
            if (base.endsWith(".rpm") || base.endsWith(".rpm.sig")) return true;

            // Windows release assets
            if (base.endsWith(".msi") || base.endsWith(".msi.sig")) return true;
            if (base.endsWith("-setup.exe") || base.endsWith("-setup.exe.sig")) return true;

            // Optional updater archives if v1Compatible
            if (base.endsWith(".AppImage.tar.gz") || base.endsWith(".AppImage.tar.gz.sig")) return true;
            if (base.endsWith(".nsis.zip") || base.endsWith(".nsis.zip.sig") || base.endsWith(".msi.zip") || base.endsWith(".msi.zip.sig")) return true;

            return false;
          }

          const allDiscoveredFiles = walk(artifactsDir);
          const filteredFiles = allDiscoveredFiles.filter(isReleaseAsset);

          console.log("=== ALL DISCOVERED FILE COUNT ===");
          console.log(`Total files discovered: ${allDiscoveredFiles.length}`);

          console.log("=== FILTERED RELEASE ASSETS ===");
          console.log(`Release assets (${filteredFiles.length}):`, filteredFiles.map(f => path.basename(f)));

          // Flatten filtered release artifacts into release-upload/
          fs.rmSync(uploadDir, { recursive: true, force: true });
          fs.mkdirSync(uploadDir, { recursive: true });

          const basenameMap = new Map();
          for (const filePath of filteredFiles) {
            const base = path.basename(filePath);
            if (basenameMap.has(base)) {
              throw new Error(`Duplicate artifact basename detected: ${base} (${filePath} vs ${basenameMap.get(base)})`);
            }
            basenameMap.set(base, filePath);
            fs.copyFileSync(filePath, path.join(uploadDir, base));
          }

          const files = fs.readdirSync(uploadDir);

          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;

          // Choose canonical updater artifact based on createUpdaterArtifacts setting
          let linuxFile;
          let windowsFile;

          if (createUpdaterArtifacts === "v1Compatible") {
            linuxFile = files.find(f => f.endsWith(".AppImage.tar.gz"));
            windowsFile = files.find(f => f.endsWith(".nsis.zip")) || files.find(f => f.endsWith(".msi.zip")) || files.find(f => f.endsWith(".zip") && !f.endsWith(".sig"));
          } else {
            // createUpdaterArtifacts is true (Tauri v2 native mode: uncompressed installer)
            linuxFile = files.find(f => f.endsWith(".AppImage") && !f.endsWith(".sig"));
            // Canonical Windows updater target: NSIS -setup.exe (fallback to .exe or .msi)
            windowsFile = files.find(f => (f.endsWith("-setup.exe") || f.endsWith(".exe")) && !f.endsWith(".sig")) || files.find(f => f.endsWith(".msi") && !f.endsWith(".sig"));
          }

          if (!linuxFile) {
            throw new Error("Could not find a canonical Linux updater artifact (.AppImage) in " + uploadDir);
          }
          if (!windowsFile) {
            throw new Error("Could not find a canonical Windows updater artifact (-setup.exe / .msi) in " + uploadDir);
          }

          console.log("=== CANONICAL LINUX UPDATER ===");
          console.log(linuxFile);

          console.log("=== CANONICAL WINDOWS UPDATER ===");
          console.log(windowsFile);

          const linuxSigFile = linuxFile + ".sig";
          const windowsSigFile = windowsFile + ".sig";

          if (!files.includes(linuxSigFile)) {
            throw new Error(`Matching Linux signature file (${linuxSigFile}) not found in ${uploadDir}`);
          }
          if (!files.includes(windowsSigFile)) {
            throw new Error(`Matching Windows signature file (${windowsSigFile}) not found in ${uploadDir}`);
          }

          const linuxSig = fs.readFileSync(path.join(uploadDir, linuxSigFile), "utf8").trim();
          const windowsSig = fs.readFileSync(path.join(uploadDir, windowsSigFile), "utf8").trim();

          const platforms = {
            "linux-x86_64": {
              signature: linuxSig,
              url: `${baseUrl}/${linuxFile}`
            },
            "windows-x86_64": {
              signature: windowsSig,
              url: `${baseUrl}/${windowsFile}`
            }
          };

          const manifest = {
            version,
            notes: releaseNotes,
            pub_date: new Date().toISOString(),
            platforms
          };

          const manifestPath = path.join(uploadDir, "latest.json");
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));

          console.log("=== FILES COPIED TO release-upload/ ===");
          console.log(fs.readdirSync(uploadDir));
          console.log("Successfully generated " + manifestPath + ":\n", JSON.stringify(manifest, null, 2));
          '

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating title and notes..."
            gh release edit "$TAG" --title "Kaze $TAG" --notes-file release_notes.md
          else
            echo "Creating draft release for $TAG..."
            gh release create "$TAG" \
              --draft \
              --title "Kaze $TAG" \
              --notes-file release_notes.md
          fi

      - name: Upload artifacts to GitHub release with retry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          cd release-upload

          # Collect list of files to upload
          shopt -s nullglob
          FILES=( * )
          echo "Found ${#FILES[@]} artifacts to upload for release $TAG:"
          printf ' - %s\n' "${FILES[@]}"

          for file in "${FILES[@]}"; do
            [ -f "$file" ] || continue
            echo "=========================================="
            echo "Uploading: $file"
            echo "=========================================="
            uploaded=0
            for attempt in 1 2 3; do
              echo "Attempt $attempt of 3..."
              if gh release upload "$TAG" "$file" --clobber; then
                echo "✓ Successfully uploaded $file"
                uploaded=1
                break
              fi
              echo "⚠ Upload of $file failed on attempt $attempt"
              if [ "$attempt" -lt 3 ]; then
                wait_secs=$(( attempt * 10 ))
                echo "Waiting ${wait_secs}s before next attempt..."
                sleep "$wait_secs"
              fi
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "✗ Fatal: Failed to upload $file after 3 attempts."
              exit 1
            fi
          done

          echo "=========================================="
          echo "All release artifacts uploaded successfully!"
          echo "=========================================="
