[package]
name = "music-player-backend"
version = "0.1.0"
edition = "2021"
authors = ["Music Player Contributors"]
description = "Backend-First Intelligent Local Music Player"
license = "MIT OR Apache-2.0"

[lib]
name = "music_player_backend"
path = "src/lib.rs"

[[bin]]
name = "music-player-cli"
path = "src/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros"
] }

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
directories = "6.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.12"
