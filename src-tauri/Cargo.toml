[package]
name = "music-player-backend"
version = "0.1.0"
edition = "2021"
authors = ["Music Player Contributors"]
description = "Backend-First Intelligent Local Music Player"
license = "MIT OR Apache-2.0"

[lib]
name = "music_player_backend"
path = "src/lib.rs"

[[bin]]
name = "music-player-cli"
path = "src/main.rs"

[[bin]]
name = "music-player-app"
path = "src/app.rs"

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "2.0"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros"
] }

# Logging & Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
directories = "6.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
walkdir = "2.5"
strsim = "0.11"

# Metadata & Filesystem Scanning
lofty = "0.22"
notify = "8.0"

# Audio Playback
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rand = "0.8"

# Networking & External Providers
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Desktop Shell & Tauri IPC
tauri = { version = "2.0", default-features = false, features = ["wry"] }
base64 = "0.23.1"

[build-dependencies]
tauri-build = { version = "2.0", default-features = false }

[dev-dependencies]
tempfile = "3.12"
